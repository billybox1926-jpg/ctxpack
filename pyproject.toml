[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxpack"
version = "0.2.0"
authors = [
  { name = "Billy Box", email = "billybox1926@gmail.com" }
]
description = "Dependency-free repo-to-prompt pack builder for AI workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai", "context", "llm", "prompt", "cli", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/billybox1926-jpg/ctxpack"
Repository = "https://github.com/billybox1926-jpg/ctxpack"
Issues = "https://github.com/billybox1926-jpg/ctxpack/issues"
Documentation = "https://github.com/billybox1926-jpg/ctxpack#readme"

[project.scripts]
ctxpack = "ctxpack:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "BLE", "FLY", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
